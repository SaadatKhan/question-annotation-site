<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src 'self' https://*.workers.dev http://localhost:8787; img-src 'self' data:; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'self'">
  <title>Annotating Hypothetical Injections</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-panel" aria-labelledby="login-title">
      <div class="brand-mark" aria-hidden="true">IQ</div>
      <p class="eyebrow">Annotation Workspace</p>
      <h1 id="login-title">Annotating Hypothetical Injections</h1>
      <p class="login-copy">Sign in with the annotation account provided to you.</p>

      <form id="login-form" novalidate>
        <div class="field-group">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" spellcheck="false" required>
        </div>

        <div class="field-group login-password-field">
          <label for="password">Password</label>
          <div class="password-row">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="icon-button" id="toggle-password" type="button" aria-label="Show password" title="Show password">Show</button>
          </div>
        </div>

        <label class="check-row" for="remember-login">
          <input id="remember-login" name="remember-login" type="checkbox" checked>
          <span>Remember me on this device</span>
        </label>

        <div id="login-status" class="status" role="status" aria-live="polite"></div>
        <button class="primary-button full-width" id="login-button" type="submit">Sign in</button>
      </form>

      <button class="text-button hidden" id="forget-login" type="button">Forget saved login</button>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
